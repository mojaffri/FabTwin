[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fabtwin"
version = "0.2.0"
description = "Software-in-the-loop deposition control and virtual metrology laboratory"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "pandas>=2.1,<4", "scipy>=1.11,<2", "scikit-learn>=1.4,<2", "statsmodels>=0.14,<0.16", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
fabtwin = "fabtwin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["build", "reports"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
